name: Deploy — Terraform + ECS Fargate

on:
  push:
    branches:
      - main

env:
  AWS_REGION:    ${{ secrets.AWS_REGION }}
  TF_WORKING_DIR: ./terraform

jobs:
  # ═══════════════════════════════════════════════════════
  # PHASE 2 — Infrastructure Provisioning (Terraform)
  # ═══════════════════════════════════════════════════════
  terraform:
    name: "Phase 2 — Terraform Infra"
    runs-on: ubuntu-latest
    outputs:
      ecr_url:          ${{ steps.tf_output.outputs.ecr_url }}
      ecs_cluster:      ${{ steps.tf_output.outputs.ecs_cluster }}
      ecs_service:      ${{ steps.tf_output.outputs.ecs_service }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS credentials (Session Token support) ───────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Terraform setup ───────────────────────────────────
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.9"
          terraform_wrapper: false

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Import Existing Resources (State Recovery)
        working-directory: ${{ env.TF_WORKING_DIR }}
        continue-on-error: true
        run: |
          # The AWS Academy environment does not easily support S3 backend state.
          # If a previous run failed, resources may already exist. Import them to avoid AlreadyExists errors.
          terraform import aws_ecr_repository.app_repo realchat-prod || true
          terraform import aws_cloudwatch_log_group.app_logs /ecs/realchat-prod || true
          
          # Find and import Security Group if it exists
          SG_ID=$(aws ec2 describe-security-groups --filters Name=group-name,Values=realchat-ecs-sg --query "SecurityGroups[0].GroupId" --output text || echo "None")
          if [ "$SG_ID" != "None" ] && [ -n "$SG_ID" ]; then
            terraform import aws_security_group.ecs_sg $SG_ID || true
          fi

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          terraform plan \
            -var="aws_region=${{ secrets.AWS_REGION }}" \
            -out=tfplan

      - name: Terraform Apply
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform apply -auto-approve tfplan

      # ── Capture outputs for downstream jobs ───────────────
      - name: Capture Terraform outputs
        id: tf_output
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: |
          echo "ecr_url=$(terraform output -raw ecr_repository_url)"     >> "$GITHUB_OUTPUT"
          echo "ecs_cluster=$(terraform output -raw ecs_cluster_name)"   >> "$GITHUB_OUTPUT"
          echo "ecs_service=$(terraform output -raw ecs_service_name)"   >> "$GITHUB_OUTPUT"

  # ═══════════════════════════════════════════════════════
  # PHASE 3 — Container Build & ECS Deployment
  # ═══════════════════════════════════════════════════════
  build-and-deploy:
    name: "Phase 3 — Build, Push & Deploy"
    runs-on: ubuntu-latest
    needs: terraform   # Runs only after Terraform succeeds

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── AWS credentials ───────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token:     ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region:            ${{ secrets.AWS_REGION }}

      # ── Authenticate Docker → ECR ─────────────────────────
      - name: Login to Amazon ECR
        id: ecr_login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Build Docker image ────────────────────────────────
      - name: Set image tag
        id: image_tag
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          ECR_URL="${{ needs.terraform.outputs.ecr_url }}"
          echo "tag=${ECR_URL}:${SHORT_SHA}"   >> "$GITHUB_OUTPUT"
          echo "latest=${ECR_URL}:latest"      >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        run: |
          docker build \
            --file Dockerfile \
            --tag ${{ steps.image_tag.outputs.tag }} \
            --tag ${{ steps.image_tag.outputs.latest }} \
            .

      # ── Push image to ECR ─────────────────────────────────
      - name: Push image to ECR
        run: |
          docker push ${{ steps.image_tag.outputs.tag }}
          docker push ${{ steps.image_tag.outputs.latest }}

      # ── Deploy new image to ECS Fargate ──────────────────
      - name: Update ECS service with new image
        run: |
          # Fetch current task definition
          TASK_DEF_ARN=$(aws ecs describe-services \
            --cluster "${{ needs.terraform.outputs.ecs_cluster }}" \
            --services "${{ needs.terraform.outputs.ecs_service }}" \
            --query 'services[0].taskDefinition' \
            --output text)

          # Produce new task definition JSON with updated image
          NEW_TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "$TASK_DEF_ARN" \
            --query 'taskDefinition' \
            --output json | \
            jq --arg IMAGE "${{ steps.image_tag.outputs.tag }}" \
              '.containerDefinitions[0].image = $IMAGE |
               del(.taskDefinitionArn, .revision, .status,
                   .requiresAttributes, .compatibilities,
                   .registeredAt, .registeredBy)')

          # Register new task definition revision
          NEW_TASK_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$NEW_TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' \
            --output text)

          # Update the ECS service to use the new revision
          aws ecs update-service \
            --cluster "${{ needs.terraform.outputs.ecs_cluster }}" \
            --service "${{ needs.terraform.outputs.ecs_service }}" \
            --task-definition "$NEW_TASK_ARN" \
            --force-new-deployment

      # ── Wait for service to reach steady state ─────────────
      - name: Wait for ECS service to stabilize
        run: |
          echo "Waiting for ECS service to reach steady state…"
          aws ecs wait services-stable \
            --cluster "${{ needs.terraform.outputs.ecs_cluster }}" \
            --services "${{ needs.terraform.outputs.ecs_service }}"
          echo "✅ ECS service is running and stable."

      # ── Verify at least one task is RUNNING ───────────────
      - name: Verify running tasks
        run: |
          RUNNING=$(aws ecs describe-services \
            --cluster "${{ needs.terraform.outputs.ecs_cluster }}" \
            --services "${{ needs.terraform.outputs.ecs_service }}" \
            --query 'services[0].runningCount' \
            --output text)

          echo "Running task count: ${RUNNING}"
          if [ "$RUNNING" -lt 1 ]; then
            echo "❌ No running tasks found — deployment failed."
            exit 1
          fi
          echo "✅ Deployment verified — ${RUNNING} task(s) running."
